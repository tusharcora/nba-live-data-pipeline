version: 2

models:
  - name: stg_player_game_stats
    description: >
      Silver staging model. Parses the balldontlie `/stats` endpoint payload
      out of the Bronze `raw_pulls` table (docs/prd.md §04, §06) into one row
      per player/game box-score stat line, de-duplicated to the
      most-recently-pulled version of each `stat_id` (raw_pulls is
      append-only, so the same stat line can appear across multiple pulls
      as a game is corrected/finalized).

      NOTE: the JSON shape of the balldontlie `/stats` response (see model
      SQL header comment) is now backed by a real ingestion path —
      confirmed against Employee A1's `BallDontLieClient.get_stats_pages` /
      `backfill_stats_flow` (PR #36, merged) and independently re-checked
      against the live docs at https://docs.balldontlie.io. One real
      mismatch was found and fixed: `minutes_played` previously assumed
      `data[].min` always comes back "MM:SS"; the real/documented shape is
      a plain minutes-only string (e.g. "30"), which the parse now handles
      alongside "MM:SS" (balldontlie has historically been inconsistent
      about this field across query modes/seasons). This has still only
      been reviewed via `dbt parse --no-partial-parse` and
      `dbt compile --no-populate-cache` in this sandbox — it has not been
      execution-tested against a real Postgres because no live DB is
      available in this environment.
    columns:
      - name: stat_id
        description: Primary key of one player/game box-score stat line, sourced from the raw payload's `data[].id`.
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: FK to the game this stat line belongs to, sourced from `data[].game.id`.
        data_tests:
          - not_null
          - relationships:
              # TODO(boss): this cross-model relationship test parses fine
              # standalone (ref() resolution happens at project-build time,
              # not per-branch) but will only actually RUN/PASS once this
              # branch is built together with the sibling PR that owns
              # stg_games.sql — see PR description for status.
              arguments:
                to: ref('stg_games')
                field: game_id
      - name: player_id
        description: FK to the player this stat line belongs to, sourced from `data[].player.id`.
        data_tests:
          - not_null
      - name: player_first_name
        description: Player's first name, sourced from `data[].player.first_name`.
      - name: player_last_name
        description: Player's last name, sourced from `data[].player.last_name`.
      - name: player_key
        description: >
          Always NULL on this side. Added only for union column parity
          with the sibling `stg_player_game_stats_nba` model (which needs
          a cross-source player-matching key computed at ingestion time by
          `ingestion.normalization.normalize_player_key`). balldontlie's
          `/stats` Bronze payload carries no such field, and computing one
          here would mean either touching the balldontlie ingestion path
          or duplicating that normalization logic in SQL for a source path
          that's realistically permanently empty on the current API plan —
          deliberate simplification, not an oversight.
      - name: team
        description: Full name of the team the player suited up for in this game, sourced from `data[].team.full_name`.
      - name: points
        description: Points scored, sourced from `data[].pts`.
      - name: rebounds
        description: Total rebounds, sourced from `data[].reb`.
      - name: assists
        description: Assists, sourced from `data[].ast`.
      - name: steals
        description: Steals, sourced from `data[].stl`.
      - name: blocks
        description: Blocks, sourced from `data[].blk`.
      - name: turnovers
        description: Turnovers, sourced from `data[].turnover`.
      - name: minutes_played
        description: >
          Minutes played, rounded to the nearest whole minute, parsed from
          `data[].min`. Handles both real-world formats: a plain
          minutes-only string (e.g. "30" -> 30, the current documented/
          confirmed shape) and an "MM:SS" string (e.g. "34:12" -> 34, in
          case older/different data still returns it -- the ":12" seconds
          round down here). Null when the raw value is null, empty, or
          doesn't match either pattern (e.g. a player who didn't play).
      - name: pulled_at
        description: Timestamp of the raw_pulls row this de-duplicated version was sourced from. Carried through for lineage/debugging, not a business column.
