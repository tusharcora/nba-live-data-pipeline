version: 2

models:
  - name: player_game_stats
    description: >
      Gold mart (docs/prd.md §06). One row per player/game box-score line.
      `UNION ALL` of two independent Bronze sources: balldontlie's
      `/stats` endpoint (`stg_player_game_stats`, realistically
      permanently empty on the current free API tier) and nba_api's
      local-only historical backfill (`stg_player_game_stats_nba`). No
      cross-source dedup/priority logic is implemented — deliberate
      simplification, see `player_game_stats.sql`'s header. Further
      cross-source reconciliation (vs. a third public feed) remains a
      later week's work.
    columns:
      - name: stat_id
        description: >
          Primary key of one player/game box-score stat line. A real
          bigint on both sides of the `UNION ALL` — balldontlie's native
          bigint id, and nba_api's synthetic `game_id * 10,000,000 +
          PLAYER_ID` composite (see `stg_player_game_stats_nba.sql`'s
          header) — deliberately kept numeric on both sides so no
          type-unification cast is needed here and `api`'s/`web`'s
          existing `stat_id: number` assumptions stay valid unchanged.
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: FK to the `games` gold table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
      - name: player_id
        description: FK to the player this stat line belongs to.
        data_tests:
          - not_null
      - name: player_first_name
        description: Player's first name.
      - name: player_last_name
        description: Player's last name.
      - name: player_key
        description: >
          Diacritic-stripped, lowercase cross-source player-matching key.
          Always NULL for balldontlie rows (no such field in their Bronze
          payload — deliberate simplification, see
          `stg_player_game_stats.yml`); populated for nba_stats rows,
          already computed in Python at ingestion time.
      - name: team
        description: >
          Team the player suited up for in this game. Format differs by
          source: balldontlie rows carry a full team name (e.g. "Dallas
          Mavericks"); nba_stats rows carry a team abbreviation (e.g.
          "POR") since nba_api's box-score rows don't expose a single
          full-team-name column — see `stg_player_game_stats_nba.sql`'s
          header. Deliberate, documented inconsistency, not a bug.
      - name: points
        description: Points scored.
      - name: rebounds
        description: Total rebounds.
      - name: assists
        description: Assists.
      - name: steals
        description: Steals.
      - name: blocks
        description: Blocks.
      - name: turnovers
        description: Turnovers.
      - name: minutes_played
        description: >
          Minutes played as a decimal (e.g. 30 for "30", or 34.2 for
          "34:12" if that format is ever returned). Null if
          unparseable/unavailable — see stg_player_game_stats for the
          parse logic.
