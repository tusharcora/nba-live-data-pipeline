version: 2

models:
  - name: games
    description: >
      Gold `games` table (docs/prd.md §06). One row per NBA game: reconciled
      final scores, status, and schedule. UNION ALL of two independent
      Bronze sources -- balldontlie (`stg_games`) and nba_api's local-only
      historical backfill (`stg_games_nba`) -- see games.sql's header for
      why this is a union, not a merge. Cross-source reconciliation across
      the two remains deferred, same posture as
      player_game_stats.player_key.
    config:
      # `api/src/api/routers/games.py`'s `?date=` filter predicate
      # (`WHERE game_date = :filter_date`) is the actual hot query pattern
      # here (docs/prd.md §09 / Week 4 performance plan) — dbt-postgres's
      # `indexes` config (PostgresIndexConfig: `columns`/`unique`/`type` —
      # see dbt-postgres 1.11's `dbt/adapters/postgres/impl.py`) creates
      # this the same way `dbt run` creates the table itself, independent
      # of db/'s Alembic migrations.
      indexes:
        - columns: ["game_date"]
          unique: false
    columns:
      - name: game_id
        description: balldontlie's `id` for the game. Natural key of this table.
        data_tests:
          - not_null
          - unique
      - name: game_date
        description: Calendar date of the game.
        data_tests:
          - not_null
      - name: season
        description: Season year (e.g. 2023 for the 2023-24 season).
      - name: status
        description: Raw game status string (e.g. "Final"). See stg_games.yml for vocabulary caveat.
      - name: postseason
        description: Whether the game is a postseason (playoff) game.
      - name: home_team
        description: Full name of the home team.
        data_tests:
          - not_null
      - name: away_team
        description: Full name of the visiting team.
        data_tests:
          - not_null
      - name: home_score
        description: Home team's final (or current, if still live) score.
      - name: away_score
        description: Visiting team's final (or current, if still live) score.
      - name: source_pulled_at
        description: >
          `pulled_at` of the source `raw_pulls` row this game's data came
          from (aliased from `stg_games.pulled_at`). Lineage/freshness only,
          not part of the reconciled game record itself.
