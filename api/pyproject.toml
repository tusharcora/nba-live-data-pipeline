[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tushar", email = "tusharcs0112@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "db",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.37.1",
    "httpx>=0.28.1",
    "locust>=2.42.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
# Vercel deploys only the api/ subtree, so ../db doesn't exist in that build
# context -- fetch db from this repo's own GitHub subdirectory there instead
# of a local editable path. Local dev (`cd api && uv run pytest`) still works,
# it just won't pick up uncommitted db/ changes until they're pushed.
db = { git = "https://github.com/tusharcora/nba-live-data-pipeline.git", subdirectory = "db", rev = "main" }
